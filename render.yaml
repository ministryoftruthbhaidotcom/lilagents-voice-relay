# One-click deploy on Render (https://render.com). Push this repo, then "New +" →
# "Blueprint" and point it at this folder. Set the secret env vars in the dashboard.
services:
  - type: web
    name: lilagents-voice-relay
    runtime: node
    # MUST stay "starter" ($7/mo). The free instance type scales to zero after ~15 min idle and
    # then takes ~20-30s to wake, measured 22.5s, which the user hears as dead air before the
    # morning brief starts speaking. This file is what a Blueprint deploy applies, so leaving it
    # as "free" would silently undo the upgrade on the next blueprint sync.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # set in dashboard, never commit it
      - key: EXCLUSIVE_DOWNLOAD_URL
        sync: false
      - key: INVITE_CODES
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: ELEVENLABS_API_KEY
        sync: false            # special-day songs; set in dashboard, never commit it
